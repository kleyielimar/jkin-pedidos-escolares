amily: 'Raleway';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"18ca2b3a-5abd-4ef3-a3f1-78547f7a865d\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Raleway';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8bdd5535-5e2b-403d-a109-9ac2be177eaa\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Raleway';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"da843802-e005-49fd-8ea1-cf02f9fde667\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Raleway';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5bd98db1-a646-48ea-99e6-2956b5140deb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\/style>\n  <style>/* JK Innovations - Main Application Stylesheet (Clean Light / White Theme) */\n:root {\n  /* Official Brand Colors */\n  --brand-terracotta: #9A4A3C;\n  --brand-deep-blue: #274969;\n  --brand-light-terra: #C16D4B;\n  \n  /* Theme Light Base (Clean White & Slate) */\n  --bg-main: #f8fafc;\n  --bg-card: #ffffff;\n  --bg-card-hover: #f1f5f9;\n  --bg-header: #ffffff;\n  --border-color: #e2e8f0;\n  --border-focus: #9A4A3C;\n\n  /* Typography Colors */\n  --text-main: #0f172a;\n  --text-muted: #64748b;\n  --text-light: #475569;\n\n  /* Status Colors (Light Theme High Contrast) */\n  --status-nuevo-bg: #eff6ff;\n  --status-nuevo-text: #1d4ed8;\n  --status-nuevo-border: #bfdbfe;\n\n  --status-preparando-bg: #fffbebfb;\n  --status-preparando-text: #b45309;\n  --status-preparando-border: #fde68a;\n\n  --status-enviado-bg: #fff7ed;\n  --status-enviado-text: #c2410c;\n  --status-enviado-border: #ffedd5;\n\n  --status-entregado-bg: #f0fdf4;\n  --status-entregado-text: #15803d;\n  --status-entregado-border: #bbf7d0;\n\n  /* Stock Status Colors */\n  --stock-ok-bg: #f0fdf4;\n  --stock-ok-text: #166534;\n  --stock-low-bg: #fffbe6;\n  --stock-low-text: #9a3412;\n  --stock-out-bg: #fef2f2;\n  --stock-out-text: #991b1b;\n\n  /* Elevation Shadows */\n  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);\n  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);\n  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);\n}\n\n/* Dark theme tokens: only the surface/text tokens change; brand colors and\n   status/stock badge colors stay constant across themes. */\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg-main: #0f1720;\n    --bg-card: #16212e;\n    --bg-card-hover: #1c2a3a;\n    --bg-header: #16212e;\n    --border-color: #2a3a4d;\n    --text-main: #eef2f6;\n    --text-muted: #93a4b8;\n    --text-light: #c2ccd9;\n  }\n}\n\n:root[data-theme=\"dark\"] {\n  --bg-main: #0f1720;\n  --bg-card: #16212e;\n  --bg-card-hover: #1c2a3a;\n  --bg-header: #16212e;\n  --border-color: #2a3a4d;\n  --text-main: #eef2f6;\n  --text-muted: #93a4b8;\n  --text-light: #c2ccd9;\n}\n\n/* Reset & Global */\n* {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nbody {\n  font-family: 'Outfit', 'Raleway', -apple-system, BlinkMacSystemFont, sans-serif;\n  background-color: var(--bg-main);\n  color: var(--text-main);\n  line-height: 1.5;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n}\n\n/* Header Navbar */\n.app-header {\n  background-color: var(--bg-header);\n  border-bottom: 1px solid var(--border-color);\n  position: sticky;\n  top: 0;\n  z-index: 100;\n  box-shadow: var(--shadow-sm);\n}\n\n.header-container {\n  max-width: 1400px;\n  margin: 0 auto;\n  padding: 0.85rem 1.5rem;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 1.5rem;\n}\n\n.brand-logo-wrapper {\n  display: flex;\n  align-items: center;\n  gap: 1rem;\n}\n\n.brand-logo-img {\n  height: 48px;\n  width: auto;\n  object-fit: contain;\n}\n\n.brand-title {\n  font-family: 'Raleway', sans-serif;\n  font-weight: 700;\n  font-size: 1.25rem;\n  letter-spacing: 1.5px;\n  color: var(--brand-deep-blue);\n}\n\n.brand-subtitle {\n  font-size: 0.78rem;\n  color: var(--brand-terracotta);\n  font-weight: 600;\n}\n\n/* App Navigation Tabs */\n.app-nav {\n  display: flex;\n  align-items: center;\n  gap: 0.5rem;\n  background-color: #f1f5f9;\n  padding: 0.25rem;\n  border-radius: 10px;\n  border: 1px solid var(--border-color);\n}\n\n.nav-btn {\n  display: flex;\n  align-items: center;\n  gap: 0.5rem;\n  padding: 0.6rem 1.2rem;\n  border: none;\n  background: transparent;\n  color: var(--text-muted);\n  font-weight: 600;\n  font-size: 0.92rem;\n  border-radius: 8px;\n  cursor: pointer;\n  transition: all 0.2s ease;\n}\n\n.nav-btn:hover {\n  color: var(--text-main);\n  background-color: rgba(255, 255, 255, 0.6);\n}\n\n.nav-btn.active {\n  background-color: var(--brand-deep-blue);\n  color: #ffffff;\n  box-shadow: 0 2px 6px rgba(39, 73, 105, 0.25);\n}\n\n.badge-count {\n  background-color: var(--brand-terracotta);\n  color: white;\n  font-size: 0.72rem;\n  padding: 0.15rem 0.45rem;\n  border-radius: 12px;\n  font-weight: 700;\n}\n\n.badge-count.warning {\n  background-color: #dc2626;\n}\n\n/* Header Action Buttons */\n.header-actions {\n  display: flex;\n  align-items: center;\n  gap: 0.75rem;\n}\n\n/* Buttons System */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 0.45rem;\n  padding: 0.6rem 1.2rem;\n  border-radius: 8px;\n  font-size: 0.9rem;\n  font-weight: 600;\n  cursor: pointer;\n  transition: all 0.2s ease;\n  border: none;\n  outline: none;\n}\n\n.btn-primary {\n  background-color: var(--brand-terracotta);\n  color: #ffffff;\n  box-shadow: 0 3px 10px rgba(154, 74, 60, 0.25);\n}\n\n.btn-primary:hover {\n  background-color: #833e32;\n  transform: translateY(-1px);\n}\n\n.btn-secondary {\n  background-color: var(--brand-deep-blue);\n  color: #ffffff;\n  box-shadow: 0 3px 10px rgba(39, 73, 105, 0.2);\n}\n\n.btn-secondary:hover {\n  background-color: #1e3a54;\n  transform: translateY(-1px);\n}\n\n.btn-sm {\n  padding: 0.35rem 0.75rem;\n  font-size: 0.8rem;\n}\n\n.btn-icon {\n  padding: 0.4rem;\n  border-radius: 6px;\n  background: #ffffff;\n  color: var(--text-light);\n  border: 1px solid var(--border-color);\n  cursor: pointer;\n}\n\n.btn-icon:hover {\n  background: #f1f5f9;\n  color: var(--brand-deep-blue);\n  border-color: #cbd5e1;\n}\n\n.btn-icon.danger:hover {\n  background: #fef2f2;\n  color: #dc2626;\n  border-color: #fca5a5;\n}\n\n/* Main Container */\n.main-container {\n  max-width: 1400px;\n  width: 100%;\n  margin: 0 auto;\n  padding: 1.5rem;\n  flex: 1;\n}\n\n/* KPI Summary Panel */\n.kpi-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n  gap: 1.25rem;\n  margin-bottom: 1.75rem;\n}\n\n.kpi-card {\n  background-color: var(--bg-card);\n  border: 1px solid var(--border-color);\n  border-radius: 12px;\n  padding: 1.25rem;\n  display: flex;\n  align-items: center;\n  gap: 1.25rem;\n  box-shadow: var(--shadow-sm);\n  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;\n}\n\n.kpi-card:hover {\n  transform: translateY(-2px);\n  border-color: var(--brand-light-terra);\n  box-shadow: var(--shadow-md);\n}\n\n.kpi-icon-wrapper {\n  width: 52px;\n  height: 52px;\n  border-radius: 12px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.icon-today {\n  background-color: #eff6ff;\n  color: #2563eb;\n}\n\n.icon-sales {\n  background-color: #f0fdf4;\n  color: #16a34a;\n}\n\n.icon-pending {\n  background-color: #fffbe6;\n  color: #d97706;\n}\n\n.icon-stock {\n  background-color: #fff7ed;\n  color: var(--brand-terracotta);\n}\n\n.kpi-details {\n  display: flex;\n  flex-direction: column;\n}\n\n.kpi-label {\n  font-size: 0.82rem;\n  font-weight: 600;\n  color: var(--text-muted);\n  text-transform: uppercase;\n  letter-spacing: 0.5px;\n}\n\n.kpi-value {\n  font-size: 1.65rem;\n  font-weight: 700;\n  color: var(--brand-deep-blue);\n  line-height: 1.2;\n  margin: 0.15rem 0;\n}\n\n.kpi-subtext {\n  font-size: 0.78rem;\n  color: var(--text-muted);\n}\n\n/* View Sections Toggle */\n.view-section {\n  display: flex;\n  flex-direction: column;\n  gap: 1.25rem;\n}\n\n/* v2 FIX 8: empty-state messages were always visible; .hidden only applied to .view-section */\n.empty-state.hidden { display: none; }\n\n.view-section.hidden {\n  display: none !important;\n}\n\n/* Section Toolbar */\n.section-toolbar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 1rem;\n  flex-wrap: wrap;\n  background-color: var(--bg-card);\n  padding: 1rem 1.25rem;\n  border-radius: 12px;\n  border: 1px solid var(--border-color);\n  box-shadow: var(--shadow-sm);\n}\n\n.search-box {\n  display: flex;\n  align-items: center;\n  gap: 0.6rem;\n  background-color: #f8fafc;\n  border: 1px solid var(--border-color);\n  border-radius: 8px;\n  padding: 0.55rem 0.9rem;\n  flex: 1;\n  min-width: 280px;\n  max-width: 450px;\n}\n\n.search-box svg {\n  color: var(--text-muted);\n}\n\n.search-box input {\n  background: transparent;\n  border: none;\n  outline: none;\n  color: var(--text-main);\n  font-size: 0.9rem;\n  width: 100%;\n}\n\n.search-box input::placeholder {\n  color: var(--text-muted);\n}\n\n.filter-pills {\n  display: flex;\n  align-items: center;\n  gap: 0.5rem;\n  flex-wrap: wrap;\n}\n\n.pill-btn {\n  padding: 0.45rem 0.9rem;\n  border-radius: 20px;\n  font-size: 0.82rem;\n  font-weight: 600;\n  border: 1px solid var(--border-color);\n  background: #ffffff;\n  color: var(--text-muted);\n  cursor: pointer;\n  transition: all 0.18s ease;\n}\n\n.pill-btn:hover {\n  color: var(--text-main);\n  border-color: #cbd5e1;\n  background: #f8fafc;\n}\n\n.pill-btn.active {\n  background-color: var(--brand-deep-blue);\n  color: white;\n  border-color: var(--brand-deep-blue);\n}\n\n/* Select Controls */\n.filter-controls {\n  display: flex;\n  gap: 0.75rem;\n}\n\n.select-input {\n  background-color: #ffffff;\n  color: var(--text-main);\n  border: 1px solid var(--border-color);\n  border-radius: 8px;\n  padding: 0.55rem 0.9rem;\n  font-size: 0.88rem;\n  outline: none;\n  cursor: pointer;\n}\n\n.select-input:focus {\n  border-color: var(--brand-terracotta);\n}\n\n/* Data Tables */\n.table-card {\n  background-color: var(--bg-card);\n  border-radius: 12px;\n  border: 1px solid var(--border-color);\n  box-shadow: var(--shadow-sm);\n  overflow: hidden;\n}\n\n.table-responsive {\n  width: 100%;\n  overflow-x: auto;\n}\n\n.data-table {\n  width: 100%;\n  border-collapse: collapse;\n  text-align: left;\n  font-size: 0.9rem;\n}\n\n.data-table th {\n  background-color: var(--brand-deep-blue);\n  color: #ffffff;\n  font-weight: 600;\n  font-size: 0.8rem;\n  text-transform: uppercase;\n  letter-spacing: 0.6px;\n  padding: 0.9rem 1.2rem;\n  border-bottom: 1px solid var(--border-color);\n}\n\n.data-table td {\n  padding: 0.95rem 1.2rem;\n  border-bottom: 1px solid var(--border-color);\n  color: var(--text-main);\n  vertical-align: middle;\n}\n\n.data-table tbody tr {\n  transition: background-color 0.15s ease;\n}\n\n.data-table tbody tr:hover {\n  background-color: var(--bg-card-hover);\n}\n\n/* Table Text & Badges */\n.order-id {\n  font-weight: 700;\n  font-family: monospace;\n  color: var(--brand-terracotta);\n}\n\n.client-info {\n  display: flex;\n  flex-direction: column;\n}\n\n.client-name {\n  font-weight: 600;\n  color: var(--brand-deep-blue);\n}\n\n.client-contact {\n  font-size: 0.78rem;\n  color: var(--text-muted);\n}\n\n.product-detail {\n  font-weight: 500;\n  max-width: 320px;\n}\n\n.amount-tag {\n  font-weight: 700;\n  font-size: 0.95rem;\n  color: #15803d;\n}\n\n/* Status Selector Dropdown Pills */\n.status-select {\n  padding: 0.35rem 0.75rem;\n  border-radius: 20px;\n  font-weight: 600;\n  font-size: 0.82rem;\n  border: 1px solid transparent;\n  cursor: pointer;\n  outline: none;\n  transition: all 0.15s ease;\n}\n\n.status-select.Nuevo {\n  background-color: var(--status-nuevo-bg);\n  color: var(--status-nuevo-text);\n  border-color: var(--status-nuevo-border);\n}\n\n.status-select.Preparando {\n  background-color: var(--status-preparando-bg);\n  color: var(--status-preparando-text);\n  border-color: var(--status-preparando-border);\n}\n\n.status-select.Enviado {\n  background-color: var(--status-enviado-bg);\n  color: var(--status-enviado-text);\n  border-color: var(--status-enviado-border);\n}\n\n.status-select.Entregado {\n  background-color: var(--status-entregado-bg);\n  color: var(--status-entregado-text);\n  border-color: var(--status-entregado-border);\n}\n\n/* Stock Badges */\n.stock-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.35rem;\n  padding: 0.25rem 0.65rem;\n  border-radius: 12px;\n  font-size: 0.78rem;\n  font-weight: 600;\n}\n\n.stock-badge.ok {\n  background-color: var(--stock-ok-bg);\n  color: var(--stock-ok-text);\n}\n\n.stock-badge.low {\n  background-color: var(--stock-low-bg);\n  color: var(--stock-low-text);\n}\n\n.stock-badge.out {\n  background-color: var(--stock-out-bg);\n  color: var(--stock-out-text);\n}\n\n/* Stock Quick Adjust Buttons */\n.stock-adjuster {\n  display: flex;\n  align-items: center;\n  gap: 0.4rem;\n}\n\n.stock-btn {\n  width: 28px;\n  height: 28px;\n  border-radius: 6px;\n  border: 1px solid var(--border-color);\n  background-color: #f8fafc n.form-group textarea {\n  background-color: #ffffff;\n  border: 1px solid var(--border-color);\n  border-radius: 8px;\n  padding: 0.6rem 0.85rem;\n  color: var(--text-main);\n  font-size: 0.9rem;\n  outline: none;\n  font-family: inherit;\n}\n\n.form-group input:focus,\n.form-group select:focus,\n.form-group textarea:focus {\n  border-color: var(--brand-terracotta);\n  box-shadow: 0 0 0 3px rgba(154, 74, 60, 0.12);\n}\n\n.input-readonly {\n  background-color: #f8fafc !important;\n  font-weight: 700;\n  color: #15803d !important;\n}\n\n.form-help {\n  font-size: 0.75rem;\n  color: var(--text-muted);\n}\n\n.checkbox-group {\n  margin-top: 0.5rem;\n}\n\n.checkbox-label {\n  display: flex;\n  align-items: center;\n  gap: 0.6rem;\n  font-size: 0.85rem;\n  color: var(--text-light);\n  cursor: pointer;\n}\n\n.checkbox-label input[type=\"checkbox\"] {\n  width: 16px;\n  height: 16px;\n  accent-color: var(--brand-terracotta);\n}\n\n.modal-footer {\n  display: flex;\n  justify-content: flex-end;\n  gap: 0.75rem;\n  margin-top: 1.75rem;\n  padding-top: 1rem;\n  border-top: 1px solid var(--border-color);\n}\n\n/* Printable Receipt Dialog */\n.receipt-dialog {\n  max-width: 720px;\n}\n\n.receipt-content {\n  background-color: #ffffff;\n  color: #1e293b;\n  border-radius: 12px;\n}\n\n.receipt-content .modal-header {\n  border-bottom: 1px solid #e2e8f0;\n}\n\n.receipt-content .modal-header h3 {\n  color: var(--brand-deep-blue);\n}\n\n.modal-header-actions {\n  display: flex;\n  align-items: center;\n  gap: 0.75rem;\n}\n\n.receipt-printable {\n  padding: 1rem 0.5rem;\n  font-family: 'Raleway', sans-serif;\n  color: #1e293b;\n}\n\n.receipt-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  gap: 1.5rem;\n}\n\n.receipt-brand {\n  display: flex;\n  align-items: center;\n  gap: 1rem;\n}\n\n.receipt-logo {\n  height: 54px;\n  width: auto;\n}\n\n.receipt-company {\n  font-size: 1.3rem;\n  font-weight: 700;\n  color: var(--brand-deep-blue);\n  let  background-color: #f8fafc;\n  padding: 0.8rem 1rem;\n  border-radius: 6px;\n  border: 1px solid #e2e8f0;\n}\n\n.total-row {\n  display: flex;\n  justify-content: space-between;\n  font-size: 0.88rem;\n}\n\n.total-row.highlight {\n  border-top: 1px solid #cbd5e1;\n  padding-top: 0.4rem;\n  font-size: 1rem;\n  color: var(--brand-terracotta);\n}\n\n.receipt-footer-terms {\n  margin-top: 1.5rem;\n  text-align: center;\n  font-size: 0.78rem;\n  color: #64748b;\n  border-top: 1px dashed #cbd5e1;\n  padding-top: 0.8rem;\n}\n\n/* Toast Notifications */\n.toast-container {\n  position: fixed;\n  bottom: 1.5rem;\n  right: 1.5rem;\n  display: flex;\n  flex-direction: column;\n  gap: 0.6rem;\n  z-index: 1000;\n}\n\n.toast {\n  background-color: #ffffff;\n  color: var(--text-main);\n  border-left: 4px solid var(--brand-terracotta);\n  padding: 0.85rem 1.25rem;\n  border-radius: 8px;\n  box-shadow: var(--shadow-lg);\n  font-size: 0.88rem;\n  font-weight: 500;\n  display: flex;\n  align-items: center;\n  gap: 0.75rem;\n  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);\n  border-top: 1px solid var(--border-color);\n  border-right: 1px solid var(--border-color);\n  border-bottom: 1px solid var(--border-color);\n}\n\n.toast.success { border-left-color: #16a34a; }\n.toast.info { border-left-color: #2563eb; }\n.toast.warning { border-left-color: #d97706; }\n\n@keyframes slideIn {\n  from { transform: translateX(100%); opacity: 0; }\n  to { transform: translateX(0); opacity: 1; }\n}\n\n/* Print Styles */\n@media print {\n  body * {\n    visibility: hidden;\n  }\n  .receipt-printable, .receipt-printable * {\n    visibility: visible;\n  }\n  .receipt-printable {\n    position: absolute;\n    left: 0;\n    top: 0;\n    width: 100%;\n  }\n  .no-print {\n    display: none !important;\n  }\n}\n\n/* Responsive Rules */\n@media (max-width: 900px) {\n  .header-container {\n    flex-direction: column;\n    align-items: flex-start;\n  }\n  .header-actions {\n    width: 100%;\n    justify-c  stroke-width=\"2\" d=\"M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z\"><\/path>\n          <\/svg>\n          <input type=\"text\" id=\"orderSearchInput\" data-i18n-placeholder=\"orderSearchPlaceholder\" placeholder=\"Buscar por cliente, producto o ID de pedido...\" oninput=\"filterOrders()\">\n        <\/div>\n\n        <div class=\"filter-pills\">\n          <button class=\"pill-btn active\" data-status=\"all\" onclick=\"setOrderStatusFilter('all', this)\" data-i18n=\"filterAll\">Todos<\/button>\n          <button class=\"pill-btn status-nuevo\" data-status=\"Nuevo\" onclick=\"setOrderStatusFilter('Nuevo', this)\" data-i18n=\"filterNuevo\">Nuevo<\/button>\n          <button class=\"pill-btn status-preparando\" data-status=\"Preparando\" onclick=\"setOrderStatusFilter('Preparando', this)\" data-i18n=\"filterPreparando\">Preparando<\/button>\n          <button class=\"pill-btn status-enviado\" data-status=\"Enviado\" onclick=\"setOrderStatusFilter('Enviado', this)\" data-i18n=\"filterEnviado\">Enviado<\/button>\n          <button class=\"pill-btn status-entregado\" data-status=\"Entregado\" onclick=\"setOrderStatusFilter('Entregado', this)\" data-i18n=\"filterEntregado\">Entregado<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- Orders Data Table -->\n      <div class=\"table-card\">\n        <div class=\"table-responsive\">\n          <table class=\"data-table\" id=\"ordersTable\">\n            <thead>\n              <tr>\n                <th data-i18n=\"thOrderId\">ID Pedido<\/th>\n                <th data-i18n=\"thClient\">Cliente<\/th>\n                <th data-i18n=\"thProduct\">Detalle / Producto<\/th>\n                <th data-i18n=\"thQty\">Cant.<\/th>\n                <th data-i18n=\"thTotal\">Total (USD)<\/th>\n                <th data-i18n=\"thDate\">Fecha<\/th>\n                <th data-i18n=\"thStatus\">Estado (Cambio R\u00e1pido)<\/th>\n                <th data-i18n=\"thActions\">Acciones<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"ordersTableBody\">\n              <!-- Rendered dynamically -->\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"empty-state hidden\" id=\"ordersEmptyState\">\n          <svg width=\"48\" height=\"48\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" d=\"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2\"><\/path>\n          <\/svg>\n          <p data-i18n=\"ordersEmpty\">No se encontraron pedidos que coincidan con la b\u00fasqueda.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- SECTION 2: INVENTORY CONTROL VIEW -->\n    <section id=\"inventoryView\" class=\"view-section hidden\">\n      <div class=\"section-toolbar\">\n        <div class=\"search-box\">\n          <svg width=\"20\" height=\"20\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z\"><\/path>\n          <\/svg>\n          <input type=\"text\" id=\"inventorySearchInput\" data-i18n-placeholder=\"inventorySearchPlaceholder\" placeholder=\"Buscar prenda o insumo por nombre o SKU...\" oninput=\"filterInventory()\">\n        <\/div>\n\n        <div class=\"filter-controls\">\n          <select id=\"inventoryCategoryFilter\" onchange=\"filterInventory()\" class=\"select-input\">\n            <option value=\"all\" data-i18n=\"catFilterAll\">Todas las Categor\u00edas<\/option>\n            <option value=\"Prendas Base\" data-i18n=\"catBase\">Prendas Base<\/option>\n            <option value=\"Uniformes\" data-i18n=\"catUniformes\">Uniformes<\/option>\n            <option value=\"Insumos Bordado\" data-i18n=\"catBordado\">Insumos Bordado<\/option>\n            <option value=\"Materiales DTF\" data-i18n=\"catDTF\">Materiales DTF / Serigraf\u00eda<\/option>\n          <\/select>\n\n          <select id=\"inventoryStockFilter\" onchange=\"filterInventory()\" class=\"select-input\">\n            <option value=\"all\" data-i18n=\"stockFilterAll\">Todos los Estados<\/option>\n            <option value=\"ok\" data-i18n=\"stockOk\">Disponible<\/option>\n            <option value=\"low\" data-i18n=\"stockLow\">Stock Bajo<\/option>\n            <option value=\"out\" data-i18n=\"stockOut\">Agotado<\/option>\n          <\/select>\n        <\/div>\n      <\/div>\n\n      <!-- Inventory Data Table -->\n      <div class=\"table-card\">\n        <div class=\"table-responsive\">\n          <table class=\"data-table\" id=\"inventoryTable\">\n            <thead>\n              <tr>\n                <th data-i18n=\"thSku\">SKU / Cod.<\/th>\n                <th data-i18n=\"thItemName\">Producto / Insumo<\/th>\n                <th data-i18n=\"thCategory\">Categor\u00eda<\/th>\n                <th data-i18n=\"thCurrentStock\">Stock Actual<\/th>\n                <th data-i18n=\"thMinStock\">Stock M\u00edn.<\/th>\n                <th data-i18n=\"thUnitPrice\">Precio Unit. (USD)<\/th>\n                <th data-i18n=\"thStatus2\">Estado<\/th>\n                <th data-i18n=\"thQuickAdjust\">Ajuste R\u00e1pido de Cantidad<\/th>\n                <th data-i18n=\"thActions\">Acciones<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"inventoryTableBody\">\n              <!-- Rendered dynamically -->\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"empty-state hidden\" id=\"inventoryEmptyState\">\n          <svg width=\"48\" height=\"48\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" d=\"M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4\"><\/path>\n          <\/svg>\n          <p data-i18n=\"inventoryEmpty\">No se encontraron productos en el inventario.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <!-- MODAL: NUEVO / EDITAR PEDIDO -->\n  <dialog id=\"orderModal\" class=\"modal-dialog\">\n    <div class=\"modal-content\">\n      <div class=\"modal-header\">\n        <h3 id=\"orderModalTitle\" data-i18n=\"orderModalTitleDefault\">Registrar Nuevo Pedido<\/h3>\n        <button class=\"close-btn\" onclick=\"closeOrderModal()\">\u00d7<\/button>\n      <\/div>\n\n      <form id=\"orderForm\" onsubmit=\"handleSaveOrder(event)\">\n        <input type=\"hidden\" id=\"orderId\">\n\n        <div class=\"form-grid\">\n          <div class=\"form-group span-2\">\n            <label for=\"orderClient\" data-i18n=\"lblClient\">Nombre del Cliente / Empresa *<\/label>\n            <input type=\"text\" id=\"orderClient\" required=\"\" data-i18n-placeholder=\"placeholderClient\" placeholder=\"Ej. Constructora Sierra / Juan P\u00e9rez\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderClientPhone\" data-i18n=\"lblPhone\">Tel\u00e9fono / Contacto<\/label>\n            <input type=\"text\" id=\"orderClientPhone\" data-i18n-placeholder=\"placeholderPhone\" placeholder=\"Ej. (510) 951-7018\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderClientEmail\" data-i18n=\"lblEmail\">Correo Electr\u00f3nico<\/label>\n            <input type=\"email\" id=\"orderClientEmail\" data-i18n-placeholder=\"placeholderEmail\" placeholder=\"cliente@empresa.com\">\n          <\/div>\n\n          <div class=\"form-group span-2\">\n            <label for=\"orderInventorySelect\" data-i18n=\"lblInvLink\">Vincular Producto de Inventario (Opcional)<\/label>\n            <select id=\"orderInventorySelect\" onchange=\"onSelectInventoryItemForOrder(this.value)\" class=\"select-input\">\n              <option value=\"\" data-i18n=\"optNoLink\">-- Servicio Personalizado / Sin vincular --<\/option>\n              <!-- Populated dynamically -->\n            <\/select>\n            <small class=\"form-help\" data-i18n=\"helpInvLink\">Selecciona una prenda o insumo registrado para descontar autom\u00e1ticamente del inventario.<\/small>\n          <\/div>\n\n          <div class=\"form-group span-2\">\n            <label for=\"orderProduct\" data-i18n=\"lblProduct\">Detalle del Producto o Servicio *<\/label>\n            <input type=\"text\" id=\"orderProduct\" required=\"\" data-i18n-placeholder=\"placeholderProduct\" placeholder=\"Ej. 25 Playeras Polo Azules con Bordado Frente y Espalda\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderQuantity\" data-i18n=\"lblQty\">Cantidad *<\/label>\n            <input type=\"number\" id=\"orderQuantity\" min=\"1\" value=\"1\" required=\"\" oninput=\"calculateOrderTotal()\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderUnitPrice\" data-i18n=\"lblUnitPrice\">Precio Unitario (USD) *<\/label>\n            <input type=\"number\" id=\"orderUnitPrice\" step=\"0.01\" min=\"0\" value=\"0.00\" required=\"\" oninput=\"calculateOrderTotal()\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderTotal\" data-i18n=\"lblOrderTotal\">Total Pedido (USD) *<\/label>\n            <input type=\"number\" id=\"orderTotal\" step=\"0.01\" min=\"0\" value=\"0.00\" required=\"\" readonly=\"\" class=\"input-readonly\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderDeposit\" data-i18n=\"lblDeposit\">Dep\u00f3sito / Anticipo (USD)<\/label>\n            <input type=\"number\" id=\"orderDeposit\" step=\"0.01\" min=\"0\" value=\"0.00\" data-i18n-placeholder=\"placeholderDeposit\" placeholder=\"Ej. 50% de anticipo\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderDate\" data-i18n=\"lblOrderDate\">Fecha de Registro *<\/label>\n            <input type=\"date\" id=\"orderDate\" required=\"\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"orderStatus\" data-i18n=\"lblOrderStatus\">Estado Inicial *<\/label>\n            <select id=\"orderStatus\" class=\"select-input\">\n              <option value=\"Nuevo\" data-i18n=\"filterNuevo\">Nuevo<\/option>\n              <option value=\"Preparando\" data-i18n=\"filterPreparando\">Preparando<\/option>\n              <option value=\"Enviado\" data-i18n=\"filterEnviado\">Enviado<\/option>\n              <option value=\"Entregado\" data-i18n=\"filterEntregado\">Entregado<\/option>\n            <\/select>\n          <\/div>\n\n          <div class=\"form-group span-2 checkbox-group\">\n            <label class=\"checkbox-label\">\n              <input type=\"checkbox\" id=\"orderDeductStock\" checked=\"\">\n              <span data-i18n=\"lblDeductStock\">Descontar la cantidad ingresada del stock de inventario autom\u00e1ticamente<\/span>\n            <\/label>\n          <\/div>\n\n          <div class=\"form-group span-2\">\n            <label for=\"orderNotes\" data-i18n=\"lblNotes\">Notas / Especificaciones de Producci\u00f3n<\/label>\n            <textarea id=\"orderNotes\" rows=\"2\" data-i18n-placeholder=\"placeholderNotes\" placeholder=\"Ej. Bordado hilo dorado 10cm de ancho. Fecha l\u00edmite de entrega pr\u00f3ximo viernes.\"><\/textarea>\n          <\/div>\n        <\/div>\n\n        <div class=\"modal-footer\">\n          <button type=\"button\" class=\"btn btn-secondary\" onclick=\"closeOrderModal()\" data-i18n=\"btnCancel\">Cancelar<\/button>\n          <button type=\"submit\" class=\"btn btn-primary\" data-i18n=\"btnSaveOrder\">Guardar Pedido<\/button>\n        <\/div>\n      <\/form>\n    <\/div>\n  <\/dialog>\n\n  <!-- MODAL: NUEVO / EDITAR \u00cdTEM DE INVENTARIO -->\n  <dialog id=\"inventoryModal\" class=\"modal-dialog\">\n    <div class=\"modal-content\">\n      <div class=\"modal-header\">\n        <h3 id=\"inventoryModalTitle\" data-i18n=\"invModalTitleDefault\">Agregar Producto al Inventario<\/h3>\n        <button class=\"close-btn\" onclick=\"closeInventoryModal()\">\u00d7<\/button>\n      <\/div>\n\n      <form id=\"inventoryForm\" onsubmit=\"handleSaveInventory(event)\">\n        <input type=\"hidden\" id=\"invId\">\n\n        <div class=\"form-grid\">\n          <div class=\"form-group\">\n            <label for=\"invSku\" data-i18n=\"lblSku\">C\u00f3digo / SKU *<\/label>\n            <input type=\"text\" id=\"invSku\" required=\"\" data-i18n-placeholder=\"placeholderSku\" placeholder=\"Ej. POL-AZU-L\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"invCategory\" data-i18n=\"lblCategory\">Categor\u00eda *<\/label>\n            <select id=\"invCategory\" class=\"select-input\" required=\"\">\n              <option value=\"Prendas Base\" data-i18n=\"catBase\">Prendas Base<\/option>\n              <option value=\"Uniformes\" data-i18n=\"catUniformes\">Uniformes<\/option>\n              <option value=\"Insumos Bordado\" data-i18n=\"catBordado\">Insumos Bordado<\/option>\n              <option value=\"Materiales DTF\" data-i18n=\"catDTF\">Materiales DTF / Serigraf\u00eda<\/option>\n            <\/select>\n          <\/div>\n\n          <div class=\"form-group span-2\">\n            <label for=\"invName\" data-i18n=\"lblItemName\">Nombre del Producto / Insumo *<\/label>\n            <input type=\"text\" id=\"invName\" required=\"\" data-i18n-placeholder=\"placeholderItemName\" placeholder=\"Ej. Playera Polo 100% Algod\u00f3n Azul Rey Talla L\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"invStock\" data-i18n=\"lblCurrentStock\">Stock Actual *<\/label>\n            <input type=\"number\" id=\"invStock\" min=\"0\" value=\"10\" required=\"\">\n          <\/div>\n\n          <div class=\"form-group\">\n            <label for=\"invMinStock\" data-i18n=\"lblMinStock\">Stock M\u00ednimo Alerta *<\/label>\n            <input type=\"number\" id=\"invMinStock\" min=\"1\" value=\"5\" required=\"\">\n          <\/div>\n\n          <div class=\"form-group span-2\">\n            <label for=\"invPrice\" data-i18n=\"lblInvPrice\">Precio Unitario ($ USD) *<\/label>\n            <input type=\"number\" id=\"invPrice\" step=\"0.01\" min=\"0\" value=\"15.00\" required=\"\">\n          <\/div>\n        <\/div>\n\n        <div class=\"modal-footer\">\n          <button type=\"button\" class=\"btn btn-secondary\" onclick=\"closeInventoryModal()\" data-i18n=\"btnCancel\">Cancelar<\/button>\n          <button type=\"submit\" class=\"btn btn-primary\" data-i18n=\"btnSaveItem\">Guardar Producto<\/button>\n        <\/div>\n      <\/form>\n    <\/div>\n  <\/dialog>\n\n  <!-- MODAL: VER COMPROBANTE / RECIBO DE PEDIDO -->\n  <dialog id=\"receiptModal\" class=\"modal-dialog receipt-dialog\">\n    <div class=\"modal-content receipt-content\">\n      <div class=\"modal-header no-print\">\n        <h3 data-i18n=\"receiptTitle\">Comprobante de Pedido<\/h3>\n        <div class=\"modal-header-actions\">\n          <button class=\"btn btn-primary btn-sm\" onclick=\"window.print()\">\n            <svg width=\"16\" height=\"16\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z\"><\/path>\n            <\/svg>\n            <span data-i18n=\"btnPrint\">Imprimir / Guardar PDF<\/span>\n          <\/button>\n          <button class=\"close-btn\" onclick=\"closeReceiptModal()\">\u00d7<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"receipt-printable\" id=\"receiptPrintableArea\">\n        <div class=\"receipt-header\">\n          <div class=\"receipt-brand\">\n            <img src=\"f48693a3-70c9-4251-84aa-ee58c74f2181\" alt=\"JK Innovations\" class=\"receipt-logo\">\n            <div>\n              <h2 class=\"receipt-company\">JK INNOVATIONS<\/h2>\n              <p class=\"receipt-tagline\">Custom Apparel \u00b7 Corporate Branding \u00b7 Uniforms<\/p>\n              <p class=\"receipt-contact\">jkinnovations20@gmail.com \u00b7 (510) 951-7018 \u00b7 JKINnovations.net<\/p>\n            <\/div>\n          <\/div>\n          <div class=\"receipt-meta\">\n            <h4 class=\"receipt-number\" id=\"rcpNumber\">ORD-000<\/h4>\n            <p id=\"rcpDate\">Fecha: --/--/----<\/p>\n            <span class=\"rcp-status-badge\" id=\"rcpStatus\">ESTADO<\/span>\n          <\/div>\n        <\/div>\n\n        <hr class=\"receipt-divider\">\n\n        <div class=\"receipt-client-box\">\n          <h5 data-i18n=\"customerInfoHeader\">DATOS DEL CLIENTE<\/h5>\n          <p class=\"rcp-client-name\" id=\"rcpClientName\">Nombre Cliente<\/p>\n          <p id=\"rcpClientPhone\">Tel\u00e9fono: -<\/p>\n          <p id=\"rcpClientEmail\">Correo: -<\/p>\n        <\/div>\n\n        <table class=\"receipt-items-table\">\n          <thead>\n            <tr>\n              <th data-i18n=\"thProductDesc\">Descripci\u00f3n del Producto / Servicio<\/th>\n              <th class=\"text-center\" data-i18n=\"thQty\">Cant.<\/th>\n              <th class=\"text-right\" data-i18n=\"thUnitPrice\">Precio Unit. (USD)<\/th>\n              <th class=\"text-right\" data-i18n=\"thSubtotal\">Subtotal<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <tr>\n              <td id=\"rcpProduct\">Descripci\u00f3n<\/td>\n              <td class=\"text-center\" id=\"rcpQty\">1<\/td>\n              <td class=\"text-right\" id=\"rcpUnitPrice\">$0.00<\/td>\n              <td class=\"text-right\" id=\"rcpSubtotal\">$0.00<\/td>\n            <\/tr>\n          <\/tbody>\n        <\/table>\n\n        <div class=\"receipt-summary-grid\">\n          <div class=\"receipt-notes-box\">\n            <h6 data-i18n=\"notesHeader\">NOTAS Y ESPECIFICACIONES:<\/h6>\n            <p id=\"rcpNotes\">Ninguna nota especificada.<\/p>\n          <\/div>\n          <div class=\"receipt-totals-box\">\n            <div class=\"total-row\">\n              <span data-i18n=\"totalOrderLabel\">Total Orden:<\/span>\n              <strong id=\"rcpTotalAmount\">$0.00 USD<\/strong>\n            <\/div>\n            <div class=\"total-row\">\n              <span data-i18n=\"depositPaidLabel\">Anticipo Pagado:<\/span>\n              <span id=\"rcpDepositAmount\">$0.00 USD<\/span>\n            <\/div>\n            <div class=\"total-row highlight\">\n              <span data-i18n=\"balanceDueLabel\">Saldo Pendiente:<\/span>\n              <strong id=\"rcpBalanceAmount\">$0.00 USD<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"receipt-footer-terms\">\n          <p data-i18n=\"receiptFooter\">Gracias por su confianza en JK Innovations. Aliado estrat\u00e9gico para proyectar su marca.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/dialog>\n\n  <!-- TOAST NOTIFICATION CONTAINER -->\n  <div id=\"toastContainer\" class=\"toast-container\"><\/div>\n\n  <script src=\"4fba01a4-9f14-463d-9d02-416ce9459ea8\"><\/script>\n\n\n<\/body><\/html>"</script>
